[project]
name = "hawking-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JoDev00", email = "JoDev00@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "pygments>=2.21.0",
    "requests>=2.34.2",
    "termcolor>=3.3.0",
]

[project.scripts]
hawking = "hawking_tools.hawking:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
